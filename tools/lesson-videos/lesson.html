<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson video</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,100&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same tokens as static/app/app.css and tools/drug-videos/brief.html */
  :root {
    --paper: #f4f0e3; --paper-2: #ebe3cc; --ink: #2c3128; --ink-soft: #5b6054;
    --glass: rgba(255, 255, 255, 0.5); --glass-edge: rgba(255, 255, 255, 0.78);
    --olive-a: rgba(146, 136, 108, 0.88); --olive-b: rgba(104, 98, 78, 0.97); --olive-ink: #fbf6e6;
    --teal-a: #9fe3e4; --teal-b: #58bfc7; --teal-ink: #164a4f;
    --apri-a: #f7c878; --apri-b: #eaa152; --apri-ink: #3d2a10;
    --accent: #3f7a6a; --gold: #ffe3a4; --night: #25261d;
    --shadow: 0 40px 80px -30px rgba(50, 52, 36, 0.45);
    --display: 'Fraunces', Georgia, serif; --sans: 'Manrope', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; position: relative;
         background: radial-gradient(1400px 700px at 50% 0%, #fbf8ee 0%, transparent 70%), linear-gradient(180deg, var(--paper), var(--paper-2)); }
  .dunes { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; }
  .spark { fill: currentColor; }
  .deco { position: absolute; color: var(--ink-soft); opacity: .45; }
  .layer { position: absolute; inset: 0; will-change: opacity, transform; }
  .display { font-family: var(--display); font-weight: 380; font-variation-settings: 'SOFT' 100, 'opsz' 144; }
  .label { font-weight: 800; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }

  .top { position: absolute; left: 96px; right: 96px; top: 52px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 64px; height: 64px; border-radius: 20px; background: radial-gradient(circle at 35% 25%, #6b6650, #3a382b 60%, var(--night)); color: var(--gold); display: grid; place-items: center; box-shadow: 0 12px 24px -10px rgba(40,36,20,.6); }
  .mark svg { width: 32px; height: 32px; }
  .brand-name { font-family: var(--display); font-weight: 420; font-size: 32px; line-height: 1.05; }
  .brand-sub { font-size: 16px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-top: 4px; }
  .crumb { padding: 12px 24px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); font-weight: 700; font-size: 20px; color: var(--ink-soft); }

  .card { position: absolute; border-radius: 44px; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.6); }

  /* title scene */
  #title { left: 96px; right: 96px; top: 176px; bottom: 96px; padding: 70px 80px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  #title .chip { align-self: flex-start; padding: 12px 24px; border-radius: 999px; font-weight: 800; font-size: 20px; letter-spacing: .12em; text-transform: uppercase;
                 background: linear-gradient(135deg, var(--teal-a), var(--teal-b)); color: var(--teal-ink); }
  #title h1 { font-size: 132px; line-height: 1; letter-spacing: -0.015em; max-width: 1500px; }
  #title p { font-size: 34px; line-height: 1.45; color: var(--ink-soft); font-weight: 600; max-width: 1450px; }
  #title .big { position: absolute; right: 90px; top: 70px; width: 120px; height: 120px; color: var(--accent); opacity: .85; }

  /* section scene */
  .sec { left: 96px; right: 96px; top: 176px; bottom: 96px; padding: 60px 76px; display: grid; grid-template-columns: 420px 1fr; gap: 64px; }
  .sec .side { border-radius: 34px; padding: 40px 40px; display: flex; flex-direction: column; justify-content: space-between;
               background: linear-gradient(180deg, var(--olive-a), var(--olive-b)); color: var(--olive-ink); }
  .sec .side .label { color: rgba(251,246,230,.75); }
  .sec .side h2 { font-family: var(--display); font-weight: 400; font-size: 54px; line-height: 1.08; }
  .sec .side .n { font-family: var(--display); font-size: 120px; line-height: 1; color: var(--gold); opacity: .9; }
  .sec .body { align-self: center; display: grid; gap: 26px; }
  .sec .body .it { display: flex; gap: 22px; align-items: flex-start; font-size: var(--fs, 34px); line-height: 1.38; font-weight: 600; }
  .sec .body .it i { flex: none; width: calc(var(--fs, 34px) * .62); height: calc(var(--fs, 34px) * .62); margin-top: calc(var(--fs, 34px) * .38); color: var(--accent); }
  .sec .body .it i svg { display: block; width: 100%; height: 100%; }
  .sec .body .it.p { font-family: var(--display); font-weight: 360; font-size: calc(var(--fs, 34px) * 1.2); line-height: 1.45; }

  /* key points */
  #keys { left: 96px; right: 96px; top: 176px; bottom: 96px; padding: 70px 80px; border: 0;
          background: linear-gradient(140deg, var(--teal-a), var(--teal-b)); color: var(--teal-ink); box-shadow: 0 40px 80px -30px rgba(60,180,190,.6), inset 0 1px 0 rgba(255,255,255,.6);
          display: flex; flex-direction: column; justify-content: center; gap: 36px; }
  #keys .label { color: var(--teal-ink); opacity: .8; }
  #keys .kp { display: flex; gap: 26px; align-items: flex-start; font-family: var(--display); font-weight: 400; font-size: 52px; line-height: 1.2; }
  #keys .kp b { flex: none; width: 70px; height: 70px; border-radius: 22px; display: grid; place-items: center; font-family: var(--sans); font-size: 30px; font-weight: 800; background: rgba(255,255,255,.4); }

  /* end */
  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #f1e9d2;
         background: radial-gradient(80% 90% at 70% 10%, #6b6650 0%, #3d3b2d 45%, #23241c 100%); }
  #end::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 30%, #fff8 50%, transparent), radial-gradient(2px 2px at 80% 20%, #fff6 50%, transparent), radial-gradient(2px 2px at 60% 62%, #fff5 50%, transparent), radial-gradient(2px 2px at 35% 78%, #fff4 50%, transparent), radial-gradient(3px 3px at 90% 70%, #fff7 50%, transparent), radial-gradient(2px 2px at 12% 70%, #fff6 50%, transparent); }
  #end .mark { width: 128px; height: 128px; border-radius: 36px; position: relative; }
  #end .mark svg { width: 68px; height: 68px; }
  #end .t { font-family: var(--display); font-weight: 380; font-size: 92px; margin-top: 38px; position: relative; }
  #end .t em { color: var(--teal-a); }
  #end .u { font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 16px; font-weight: 800; position: relative; }
  #end .next { margin-top: 48px; padding: 16px 32px; border-radius: 999px; background: rgba(255,248,225,.1); border: 1px solid rgba(255,248,225,.2); font-size: 28px; font-weight: 700; position: relative; }
  #end .disc { position: absolute; bottom: 70px; left: 220px; right: 220px; font-size: 22px; color: rgba(241,233,210,.6); line-height: 1.45; font-weight: 500; }

  .progress { position: absolute; left: 0; bottom: 0; height: 8px; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, var(--teal-b), var(--teal-a) 50%, var(--apri-b)); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><symbol id="sp" viewBox="0 0 24 24"><path class="spark" d="M12 1c.6 5.6 4.4 9.4 11 11-6.6 1.6-10.4 5.4-11 11-.6-5.6-4.4-9.4-11-11C7.6 10.4 11.4 6.6 12 1z"/></symbol></svg>
  <svg class="dunes" viewBox="0 0 1920 360" preserveAspectRatio="none"><path d="M0 200 C 450 110 820 180 1200 130 S 1720 80 1920 120 V360 H0Z" fill="rgba(112,106,86,.09)"/><path d="M0 280 C 380 220 900 260 1350 220 S 1800 200 1920 214 V360 H0Z" fill="rgba(112,106,86,.12)"/></svg>
  <svg class="deco" style="left:1850px;top:150px;width:26px;height:26px"><use href="#sp"/></svg>
  <svg class="deco" style="left:60px;top:980px;width:20px;height:20px"><use href="#sp"/></svg>

  <div class="layer" id="chrome">
    <div class="top">
      <div class="brand"><div class="mark"><svg><use href="#sp"/></svg></div><div><div class="brand-name">Serenest Academy</div><div class="brand-sub">Lesson</div></div></div>
      <div class="crumb" id="crumb"></div>
    </div>
  </div>
  <div class="layer" id="scenes"></div>
  <div class="layer" id="sceneEnd" style="opacity:0">
    <div id="end">
      <div class="mark"><svg><use href="#sp"/></svg></div>
      <div class="t">Serenest <em>Academy</em></div>
      <div class="u">serenest.academy/app</div>
      <div class="next" id="eNext"></div>
      <p class="disc">Educational content for students and clinicians. Not medical advice; confirm current product labelling and guidelines.</p>
    </div>
  </div>
  <div class="progress" id="bar"></div>

<script>
/* window.LESSON = { course, index, total, lesson, next } is injected by render.mjs */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const SP = '<svg><use href="#sp"/></svg>';
let S = [];   // scenes: { el, a, b, items: [{el, at}] }
let TOTAL = 0;

function fit(el) {
  // shrink text until the section body fits inside its card
  const body = el.querySelector('.body'); if (!body) return;
  let fs = 40;
  el.style.setProperty("--fs", fs + "px");
  const max = el.clientHeight - 120;
  while (body.scrollHeight > max && fs > 22) { fs -= 1; el.style.setProperty('--fs', fs + 'px'); }
}

window.setupLesson = function () {
  const { course, index, total, lesson: L, next } = window.LESSON;
  $('crumb').textContent = `${course} · ${index + 1} of ${total}`;
  const root = $('scenes');
  let t = 0;
  S = [];

  // 1. title
  const title = document.createElement('div');
  title.className = 'layer';
  title.innerHTML = `<div class="card" id="title"><svg class="big">${SP.replace('<svg>', '')}</svg>
    <span class="chip">Lesson ${index + 1} · ${L.mins} min</span>
    <h1 class="display">${esc(L.title)}</h1><p>${esc(L.intro)}</p></div>`;
  title.querySelector('.big').innerHTML = '<use href="#sp"/>';
  root.appendChild(title);
  S.push({ el: title, a: t, b: t + 7.5, items: [] });
  t += 7.5;

  // 2. sections
  L.sections.forEach((sec, si) => {
    const el = document.createElement('div');
    el.className = 'layer';
    const lines = sec.ul ? sec.ul : [sec.p];
    el.innerHTML = `<div class="card sec"><div class="side"><span class="label">Part ${si + 1} of ${L.sections.length}</span><h2>${esc(sec.h)}</h2><span class="n">0${si + 1}</span></div>
      <div class="body">${lines.map((x) => `<div class="it${sec.ul ? '' : ' p'}">${sec.ul ? `<i>${SP}</i>` : ''}<span>${esc(x)}</span></div>`).join('')}</div></div>`;
    root.appendChild(el);
    fit(el.querySelector('.sec'));
    const items = [...el.querySelectorAll('.it')];
    const per = sec.ul ? items.map((it) => 2.2 + it.textContent.length / 26) : [Math.max(7, sec.p.length / 24)];
    let at = t + 1.0;
    const its = items.map((it, k) => { const r = { el: it, at }; at += per[k]; return r; });
    const end = at + 1.2;
    S.push({ el, a: t, b: end, items: its });
    t = end;
  });

  // 3. key points
  const keys = document.createElement('div');
  keys.className = 'layer';
  keys.innerHTML = `<div class="card" id="keys"><span class="label">Key points</span>${L.points.map((p, k) => `<div class="kp"><b>${k + 1}</b><span>${esc(p)}</span></div>`).join('')}</div>`;
  root.appendChild(keys);
  const kits = [...keys.querySelectorAll('.kp')].map((el, k) => ({ el, at: t + 0.8 + k * 2.6 }));
  S.push({ el: keys, a: t, b: t + 0.8 + L.points.length * 2.6 + 2.5, items: kits });
  t = S[S.length - 1].b;

  $('eNext').textContent = next ? `Now: answer ${L.quiz.length} quiz questions in the app · Next: ${next}` : `Now: answer ${L.quiz.length} quiz questions in the app`;
  window.T_END = t;
  TOTAL = t + 5;
  window.renderAt(0);
  return TOTAL;
};

function show(el, o, dy = 0) { el.style.opacity = o.toFixed(3); el.style.transform = `translateY(${dy.toFixed(1)}px)`; }

window.renderAt = function (t) {
  S.forEach((s) => {
    const inn = ease(prog(t, s.a, s.a + 0.7));
    const out = ease(prog(t, s.b - 0.5, s.b));
    show(s.el, inn * (1 - out), 40 * (1 - inn) - 30 * out);
    s.items.forEach((it) => { const p = ease(prog(t, it.at, it.at + 0.6)); show(it.el, 0.15 + 0.85 * p, 18 * (1 - p)); });
  });
  const e = ease(prog(t, window.T_END, window.T_END + 0.8));
  $('sceneEnd').style.opacity = e.toFixed(3);
  $('chrome').style.opacity = (1 - e).toFixed(3);
  $('bar').style.width = (100 * clamp(t / TOTAL)).toFixed(2) + '%';
  $('bar').style.opacity = 1 - e;
};
</script>
</body>
</html>
